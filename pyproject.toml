[project]
name = "biomed-research-agent"
version = "0.1.0"
description = "AI-powered multi-agent biomedical research assistant"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=4.0.1",
    "biopython>=1.88",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.2",
    "langfuse>=4.14.4",
    "langgraph>=1.2.10",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: 需要下载/加载大模型（PubMedBERT），运行缓慢",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = [
    "B017",   # pytest.raises(Exception)：项目有意捕获宽泛异常以测试降级逻辑
    "BLE001", # 盲 except Exception：降级策略，保证 Agent 不因单点失败崩溃
    "S110",   # try-except-pass：集合不存在/删除失败等场景的防御性处理
]
