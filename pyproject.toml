    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
