# ============================================================
# Biomed-Research-Agent — 三服务一键编排
#   App (Streamlit) + ChromaDB (向量存储) + Neo4j (知识图谱)
#
# 启动: docker-compose up -d
# 停止: docker-compose down
# 注意: 容器内服务间通信用服务名做 host（chroma / neo4j），不是 localhost
# ============================================================

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - chroma
      - neo4j
    environment:
      # 容器内指向同网络的 chroma 服务
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - chroma_data:/app/data

  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (驱动连接)
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  chroma_data:
  neo4j_data:
